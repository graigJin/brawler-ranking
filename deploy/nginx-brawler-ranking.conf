# /etc/nginx/sites-available/brawler-ranking
#
# Vhost fuer die Brawl Ranker Static Site. Analog zu den anderen
# zettzilla-Projekten aufbauen/anpassen (Domain unten ersetzen).
#
# Setup:
#   1. Repo auf den VPS pullen, z.B. nach /var/www/brawler-ranking
#   2. Diese Datei nach /etc/nginx/sites-available/brawler-ranking kopieren
#      und "brawler.example.com" durch die echte (Sub-)Domain ersetzen
#   3. ln -s /etc/nginx/sites-available/brawler-ranking /etc/nginx/sites-enabled/
#   4. certbot --nginx -d brawler.example.com
#      (certbot schreibt den SSL-Block automatisch in diese Datei um)
#   5. nginx -t && systemctl reload nginx
#
# Updates: im Repo-Ordner `git pull`, kein Build-Schritt noetig (reines
# HTML/CSS/JS).

server {
    listen 80;
    listen [::]:80;
    server_name brawler.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/brawler-ranking;
    }

    location / {
        return 301 https://brawler.example.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name brawler.example.com;

    root /var/www/brawler-ranking;
    index index.html;

    # certbot fuegt ssl_certificate / ssl_certificate_key hier ein
    # ssl_certificate     /etc/letsencrypt/live/brawler.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/brawler.example.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ~* \.(?:css|js|json|svg|png|jpg|jpeg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
